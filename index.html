<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personagem</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="principal">
        <div class="info-gerais">

            <div class="nome-jogador">
                <p>Nome do Jogador:</p>
                <input type="text">
            </div>

            <div class="nome-personagem">
                <p>Nome do Personagem:</p>
                <input type="text">
            </div>

            <div class="raca">
                <p>Raça:</p>
                <select name="" id="">
                    <option value="none" selected disabled></option>
                    <option value="Goblin">Goblin</option>
                    <option value="elfo">elfo</option>
                    <option value="vampiro">vampiro</option>
                    <option value="gigante">gigante</option>
                    <option value="morto-vivo">morto-vivo</option>
                    <option value="draconico">draconico</option>
                    <option value="demonio">demonio</option>
                    <option value="anão">anão</option>
                    <option value="humano">humano</option>
                    <option value="anjo">anjo</option>
                </select>
            </div>

            <div class="classe">
                <p>classe:</p>
                <select name="" id="">
                    <option value="none" selected disabled></option>
                    <option value="arqueiro">arqueiro</option>
                    <option value="mago">mago</option>
                    <option value="armeiro">armeiro</option>
                    <option value="ferreiro">ferreiro</option>
                    <option value="cavalheiro">cavalheiro</option>
                    <option value="piromaniaco">piromaniaco</option>
                    <option value="guerreiro">guerreiro</option>
                </select>
            </div>

        </div>

        <div class="info-status">

            <div class="Hp">
                <p>Hp:</p>
                <input type="number" name="" id="">
            </div>

            <div class="forca">
                <p>Força:</p>
                <input type="number" name="" id="">
            </div>

            <div class="destreza">
                <p>destreza:</p>
                <input type="number" name="" id="">
            </div>

            <div class="estamina">
                <p>estamina:</p>
                <input type="number" name="" id="">
            </div>

            <div class="defesa">
                <p>defesa:</p>'
                <input type="n'umber" name="" id="">
            </div>

            <div class="resistencia">
                <p>resistencia:</p>
                <input type="number" name="" id="">
            </div>
            <div class="pontos-de-mana">
                <p>pontos-de-mana:</p>
                <input type="number" name="" id="">
            </div>

            <div class="fe">
                <p>Fé:</p>
                <input type="number" name="" id="">
            </div>
        </div>  
        

        <div class="info-inventario">

            <div class="inventario">
                <p> Inventario</p>
                <textarea name="" id="" cols="15" rows="10"></textarea>
            </div>

            <div class="imagem">
                <p>Imagem</p>
                <input type="file" name="" id="">
            </div>

            <div class="bibiografia">
                <p>Biografia</p>
                <textarea name="" id="" cols="15" rows="10"></textarea>
            </div>

        </div>
    </div>

</body>

</html>
